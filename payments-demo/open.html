<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Window open</title>
</head>
<body>
  <h2>Window open</h2>
  <button id="btn1">Open pay window and wait it close</button>
  <br>
  <button id="btn2">Open pay window and wait post-message</button>


  <div id="res" style="margin: 2rem 0;"></div>

  <script>

  const openWindow = (waitForClose = false) => {

    const payWindow = window.open(`https://xneek-job.netlify.app/payments-demo/${waitForClose?'':'?postmessage=1'}`, '_blank');

    const info = document.createElement('span');
    info.textContent = 'Wait for payment...⏳'
    res.append(info);

    const cancelBtn = document.createElement('button');
    cancelBtn.textContent = 'Cancel';
    cancelBtn.onclick = () => {
      payWindow.close();
      res.textContent = 'Pay was canceled 😕'
    }
    res.append(cancelBtn);

    payWindow.onmessage = (e) => {
      res.textContent = e.data
    }

    if (waitForClose) {
      const timer = setInterval(() => {
        if (payWindow.closed) {
          clearInterval(timer);
          res.textContent = 'Pay window was closed. Check payments state and make something...';
        }
      }, 500);
    }

  }

  btn1.onclick = () => openWindow(true);
  btn2.onclick = () => openWindow(false);

  </script>
</body>
</html>
