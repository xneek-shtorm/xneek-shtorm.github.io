<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Window open</title>
</head>
<body>
  <h2>Window open</h2>
  <a href="#pay"  id="payBtn">Pay 💰</a>

  <div id="res" style="margin: 2rem 0;"></div>

  <script>
    payBtn.onclick = (e) => {
      e.preventDefault();
      const payWindow = window.open(`https://xneek-job.netlify.app/payments-demo/`, '_blank');

      const info = document.createElement('span');
      info.textContent = 'Wait for payment...⏳'
      res.append(info);

      const cancelBtn = document.createElement('button');
      cancelBtn.textContent = 'Cancel';
      cancelBtn.onclick = () => {
        payWindow.close();
        res.textContent = 'Pay was canceled 😕'
      }
      res.append(cancelBtn);

      payWindow.onmessage = (e) => {
        res.textContent = e.data
      }

  
      const timer = setInterval(() => {
        if (payWindow.closed) {
          clearInterval(timer);
          res.textContent = 'Pay window was closed. Check payments state and make something...';
        }
      }, 500);

    }
  </script>
</body>
</html>
