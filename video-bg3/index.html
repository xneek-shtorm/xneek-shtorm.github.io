<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Background Replacement (Offline)</title>
    <style>
        body { margin: 0; height: 100vh; overflow: hidden; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif; color: #fff; }
        #controls { margin-bottom: 15px; display: flex; gap: 15px; z-index: 10; }
        #canvas { max-width: 100vw; max-height: 80vh; width: auto; height: auto; background: #000; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        video { display: none; }
    </style>
</head>
<body>
    <div id="controls">
        <button id="startBtn">Start Camera</button>
        <label>Change BG: <input type="file" id="bgUpload" accept="image/*"></label>
    </div>
    <video id="video" width="1280" height="720" autoplay playsinline></video>
    <canvas id="canvas" width="1280" height="720"></canvas>

    <script type="module" src="./main.js"></script>
</body>
</html>
