<!DOCTYPE html>
<html>
<head>
    <title>Selfie Segmentation</title>
    <style>
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background: #1a1a1a; 
            font-family: Arial, sans-serif;
        }
        .container {
            display: flex;
            gap: 20px;
            padding: 20px;
            background: #2d2d2d;
            border-radius: 10px;
        }
        video { display: none; }
        canvas { 
            border-radius: 8px; 
            background: #333;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            color: white;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover { background: #45a049; }
        .status {
            font-size: 12px;
            color: #aaa;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="output" width="640" height="480"></canvas>
        <div class="controls">
            <h3>Selfie Segmentation</h3>
            <button id="toggleBtn">Start</button>
            <button id="blurBtn">Toggle Blur</button>
            <div class="status" id="status">Ready</div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "onnxruntime-web": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.1/dist/esm/ort.min.js"
            }
        }
    </script>
    <script type="module" src="segmentation.js"></script>
</body>
</html>
