<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Замена фона</title>
<style>
  body{margin:0;background:#000;display:grid;place-items:center;min-height:100vh}
  video{display:none}
  canvas{max-width:100vw;max-height:100vh}
</style>
<video id="v" muted playsinline></video>
<canvas id="c"></canvas>

<script type="module">
import {FilesetResolver, ImageSegmenter} from
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const v = document.getElementById("v");
const c = document.getElementById("c");
const ctx = c.getContext("2d");
const person = document.createElement("canvas");
const pctx  = person.getContext("2d");
const maskC = document.createElement("canvas");
const mctx  = maskC.getContext("2d");

const bg = new Image();
bg.src = "./bg.png";
await bg.decode();

await navigator.mediaDevices.getUserMedia(
  {video: {width: {ideal: 640}, height: {ideal: 480}}}
).then(s => v.srcObject = s);
await v.play();
c.width = person.width = v.videoWidth;
c.height = person.height = v.videoHeight;

const seg = await ImageSegmenter.createFromOptions(
  await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"),
  {runningMode: "VIDEO",
   outputCategoryMask: true,
   outputConfidenceMasks: false,
   baseOptions: {delegate: "GPU",
     modelAssetPath: "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite"}});

let imgData, buf, personVal = -1;

let lastT = -1;
function frame() {
  requestAnimationFrame(frame);
  if (v.currentTime === lastT) return;
  lastT = v.currentTime;

  seg.segmentForVideo(v, performance.now(), r => {
    const mask = r.categoryMask.getAsUint8Array();

    if (!imgData) {
      maskC.width  = mask.length === c.width * c.height
                   ? c.width : Math.sqrt(mask.length) | 0;
      maskC.height = mask.length / maskC.width;
      imgData = mctx.createImageData(maskC.width, maskC.height);
      buf = new Uint32Array(imgData.data.buffer);
    }

    // ИСПРАВЛЕНИЕ: один раз запоминаем, каким значением помечен человек.
    // В центре кадра обычно человек — берём значение маски в этой точке.
    if (personVal < 0) personVal = mask[mask.length >> 1];

    for (let i = 0; i < mask.length; i++)
      buf[i] = mask[i] === personVal ? 0xFFFFFFFF : 0;
    mctx.putImageData(imgData, 0, 0);

    ctx.drawImage(bg, 0, 0, c.width, c.height);
    pctx.globalCompositeOperation = "source-over";
    pctx.drawImage(v, 0, 0);
    pctx.globalCompositeOperation = "destination-in";
    pctx.drawImage(maskC, 0, 0, person.width, person.height);
    ctx.drawImage(person, 0, 0);
  });
}
frame();
</script>
