<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pen</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <div id="modal">
      <video muted playsinline id="bigVideo"></video>
      <div id="box">
        <header>
          <div id="smallVideoContainer">
            <video muted playsinline id="smallVideo"></video>
          </div>
        </header>
        <main>
          <aside class="toolbar2">
            <button id="printBtn">
              <i class="bi bi-printer"></i>
            </button>
            <button id="printBtn">
              <i class="bi bi-volume-down"></i>
            </button>
 
            <button id="printBtn">
              <i class="bi bi-volume-up"></i>
            </button>
            <button id="addBtnTb2">
              <i class="bi bi-plus-circle-dotted"></i>
            </button>
          </aside>
        </main>
        <footer>
          <aside class="toolbar">
            <button id="phoneBtn"><i class="bi bi-telephone"></i></button>
            <button id="btnMic"><i class="bi bi-mic"></i></button>
            <button id="addBtnTb1"><i class="bi bi-pause-fill"></i></button>
          </aside>
        </footer>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
