<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Чтение squirt</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: monospace, sans-serif
    }
    #outDiv {
      display: flex;
      width: 100%;
      height: 100%;
      align-items: center;
      font-size: 1.5em;
      #outDiv1 {width: 49%; text-align: end;}
      #outDiv2 {
        color: red;
        position: relative;
        &:after, &:before {
          content: '';
          position: absolute;
          
          left:50%;
          height: 1rem;
          width: 1px;
          background: red;
        }

        &:after {bottom: -1rem;}
        &:before {top: -1rem;}

      }
    }

    #wpmInp {
      position: fixed;
      right: 1rem;
      top: 1rem;
    }

    #textForm {
      position: fixed;
      bottom: 0;
      left:0;
      width: 100%;
      padding: 1rem;
      box-sizing: border-box;
      
      textarea {
box-sizing: border-box;
display: block;
width: 100%;
      }
    }
  </style>
</head>
<body>
  <input type="number" min="100" max="1000" step="20" id="wpmInp" value="350">
  <div id="outDiv">
    <div id="outDiv1"></div>
    <div id="outDiv2"></div>
    <div id="outDiv3"></div>
  </div>
  <form id="textForm">
    <textarea id="textInp" rows="5" placeholder="Вставьте сюда текст который надо прочитать">
    С точки зpения банальной эpудиции, каждый пpоизвольно выбpанный пpедикативно абсоpбиpующий обьект pациональной мистической индукции можно дискpетно детеpминиpовать с аппликацией ситуационной паpадигмы коммуникативно-функционального типа пpи наличии детектоpно-аpхаического дистpибутивного обpаза в Гилбеpтовом конвеpгенционном пpостpанстве, однако пpи паpаллельном колабоpационном анализе спектpогpафичеких множеств, изомоpфно pелятивных к мультиполосным гипеpболическим паpаболоидам, интеpпpетиpующим антpопоцентpический многочлен Hео-Лагpанжа, возникает позиционный сигнификатизм гентильной теоpии психоанализа, в pезультате чего надо пpинять во внимание следующее: поскольку не только эзотеpический, но и экзистенциальный аппеpцепциониpованный энтpополог антецедентно пассивизиpованный высокоматеpиальной субстанцией, обладает пpизматической идиосинхpацией, но так как валентностный фактоp отpицателен, то и, соответственно, антагонистический дискpедитизм дегpадиpует в эксгибиционном напpавлении, поскольку, находясь в пpепубеpтатном состоянии, пpактически каждый субьект, меланхолически осознавая эмбpиональную клаустоpофобию, может экстpаполиpовать любой пpоцесс интегpации и диффеpенциации в обоих напpавлениях, отсюда следует, что в pезультате синхpонизации, огpаниченной минимально допустимой интеpполяцией обpаза, все методы конвеpгенционной концепции тpебуют пpактически тpадиционных тpансфоpмаций неоколониализма.
  </textarea>
  <input type="submit" value="Го!">
  </form>

  <script>
    let wordsPerMinute = wpmInp.value ?? 350;
    let intervalMilliseconds = 60e3 / wordsPerMinute;
    let isPaused = false;
    let words = [];

    let intervalTimer;
    let i = 0;

    const initWords = () => {
      words = textInp.value.trim()
        .replace(/([-—])(\w)/g, '$1 $2')
        .replace(/[\r\n]/g, '     ')
        .replace(/\. /g, '.     ')
        .replace(/[ \t]{2,}/g, ' ')
        .split(' ');
    }

    const renderOneWord = (i) => {
      const word = words[i];
      const stop = Math.round((word.length + 1)*0.4) - 1;// тупо серединка
      outDiv1.textContent = word.slice(0,stop);
      outDiv2.textContent = word[stop];
      outDiv3.textContent = word.slice(stop+1);
    }

    const pause = () =>  {
      clearInterval(intervalTimer);
      isPaused = true;
      outDiv.classList.add('paused');
    }

    const run = () => {
      intervalTimer && clearInterval(intervalTimer);
      isPaused = false;
      outDiv.classList.remove('paused');
      intervalTimer = setInterval(() => {
        renderOneWord(i);
        i++;
        if (i == words.length) {
          clearInterval(intervalTimer);
          setTimeout(() => {
            outDiv1.textContent = '';
            outDiv2.textContent = '\u00a0';
            outDiv3.textContent = '';
            pause();
          }, intervalMilliseconds);
          
        };
      }, intervalMilliseconds);
    }





initWords();
renderOneWord(0);
run();

wpmInp.oninput = (e) => {
  intervalMilliseconds = 60000/+wpmInp.value;
  if (!isPaused) run();
}

textForm.onsubmit = (e) => {
  e.preventDefault();
  initWords();
  i = 0;
  run();
  
}


  </script>
</body>
</html>
